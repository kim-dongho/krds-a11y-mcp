  display: flex;
  align-items: normal;
  justify-content: flex-start;
  flex-direction: column;

}

  }
}
.page-title-wrap .h-tit {
  font-size: var(--krds-pc-font-size-heading-xlarge);

.page-btn-wrap {

  justify-content: flex-end;
  gap: var(--krds-gap-5);
  margin-top: var(--krds-gap-9);
}

  justify-content: space-between;
}

  border-color: var(--krds-high-contrast-color-border-secondary-light);
  background-color: var(--krds-high-contrast-color-surface-secondary-subtler);
}
[data-krds-mode=high-contrast] .txt-box.bg-white {
  --bg-white-color-background: var(--krds-high-contrast-color-surface-white-subtler);
  --bg-white-color-background-gray: var(--krds-high-contrast-color-surface-gray-subtler);
  --bg-white-color-border: var(--krds-high-contrast-color-divider-gray-light);
  --bg-white-color-text: var(--krds-high-contrast-color-text-subtle);
}
@media (prefers-color-scheme: dark) {
  [data-krds-mode=theme] .conts-wrap {
    color: var(--krds-high-contrast-color-text-bolder);
  }
  [data-krds-mode=theme] .txt-box {
    --txt-box-width-border: var(--krds-high-contrast-border-width-static-regular);
    --txt-box-color-border: var(--krds-high-contrast-color-border-gray);
    --txt-box-color-background: var(--krds-high-contrast-color-surface-gray-subtler);
  }
  [data-krds-mode=theme] .txt-box.outline {
    border-color: var(--krds-high-contrast-color-border-secondary-light);
    background-color: var(--krds-high-contrast-color-surface-secondary-subtler);
  }
  [data-krds-mode=theme] .txt-box.bg-white {
    --bg-white-color-background: var(--krds-high-contrast-color-surface-white-subtler);
    --bg-white-color-background-gray: var(--krds-high-contrast-color-surface-gray-subtler);
    --bg-white-color-border: var(--krds-high-contrast-color-divider-gray-light);
    --bg-white-color-text: var(--krds-high-contrast-color-text-subtle);
  }
}
@media (max-width: 767px) {
  .conts-area[class*=login-] {
    gap: var(--krds-gap-7);
  }
}
@media (min-width: 1024px) {
  .inner.narrow {
    max-width: calc(79.2rem + var(--krds-contents-padding-x) * 2);
  }
}
/* ==== 원본 패턴 CSS 발췌 끝 ==== */
  /* 건너뛰기 도착점은 컨트롤이 아니다 — 프로그램적 초점에 페이지 전체를 감싸는
     초점 링이 뜨지 않게 억제 (킷 전역 *:focus가 main에도 적용되는 것 방지) */
  #main-content:focus { outline: none; box-shadow: none; }
  /* 교정 부속: 본문 컨테이너 교체(#container→main)로 빠진 원본 규칙 승계 —
     본문 최소 높이와 본문-푸터 간격 */
  #main-content > .inner:not(.in-between) {
    min-height: 60rem;
    padding-bottom: var(--krds-pc-gap-layout-contents-footer);
  }

  /* 교정: 킷 v1.1.0 component.css 아이콘 경로 버그(img/img 중복) — 이 페이지에
     보이는 breadcrumb 2곳만 올바른 경로로 재선언 */
  .krds-breadcrumb-wrap .breadcrumb .home .txt::before {
    -webkit-mask-image: url({{assetBase}}/resources/img/component/icon/ico_bread_home.svg);
    mask-image: url({{assetBase}}/resources/img/component/icon/ico_bread_home.svg);
  }
  .krds-breadcrumb-wrap .breadcrumb li:not(:last-child)::after {
    -webkit-mask-image: url({{assetBase}}/resources/img/component/icon/ico_angle.svg);
    mask-image: url({{assetBase}}/resources/img/component/icon/ico_angle.svg);
  }
  /* 교정: 원본 #container 키 규칙 승계 — breadcrumb을 콘텐츠 폭으로 가운데 정렬 (output.css 20848행) */
  #main-content > .krds-breadcrumb-wrap { padding-bottom: 0; }
  #main-content > .krds-breadcrumb-wrap .breadcrumb { max-width: var(--krds-contents-wrap-size); padding: 0 var(--krds-contents-padding-x); }
</style>
</head>
<body data-krds-pattern="apply-issue">
<div id="wrap">

<!-- 교정: 원본 샘플의 건너뛰기 대상(#breadcrumb)은 문서에 존재하지 않았다 -->
<div id="krds-skip-link">
  <a href="#main-content">본문 바로가기</a>
</div>

<header>
  <!-- 사이트 공통부 — get_component: masthead → header → main_menu 로 채운다 -->
</header>

<!-- 교정: 원본 샘플에는 main 랜드마크가 없었다 (div#container) -->
<div id="container">
<main id="main-content" tabindex="-1">

  <!-- 현재 경로 — 킷 breadcrumb 정식 마크업 -->
  <nav class="krds-breadcrumb-wrap" aria-label="현재 경로">
    <ol class="breadcrumb">
      <li class="home"><a href="{{homeHref}}" class="txt">홈</a></li>
      <li><a href="#" class="txt" aria-current="page">{{pageTitle}}</a></li>
    </ol>
  </nav>

  <div class="inner narrow">

    <div class="page-title-wrap">
      <h1 class="h-tit">{{pageTitle}}</h1>
    </div>

    <div class="conts-area">
      <div class="conts-wrap">

        <!-- 유의사항 — 콘텐츠 자유 영역: 서비스의 실제 안내로 교체 -->
        <div class="txt-box outline">
          <!-- 교정: 원본은 h1 다음 h4로 수준을 건너뛰었다 — h2/h3로 조정 -->
          <h2 class="outline-tit">시작하기 전에</h2>
          <p class="outline-txt">{{noticeText}}</p>
        </div>

        <!-- 신청 정보 입력 — 콘텐츠 자유 영역: 서비스 실제 필드로 교체.
             모든 입력에 label 연결 필수 (kwcag:7.3.2) -->
        <div class="txt-box bg-white">
          <h2 class="box-tit1">신청 정보 입력</h2>
          <div class="box-cnt">

            <div class="box-sec">
              <h3 class="box-tit2">대상 주소</h3>
              <div class="form-group">
                <div class="form-tit">
                  <label for="issue-addr">주소</label>
                </div>
                <div class="form-conts">
                  <div class="input-group m-column">
                    <input type="text" id="issue-addr" class="krds-input" placeholder="검색 버튼을 눌러주세요" readonly>
                    <button type="button" class="krds-btn large secondary">검색</button>
                  </div>
                </div>
              </div>
            </div>

            <div class="box-sec">
              <h3 class="box-tit2" id="issue-target-tit">발급 대상 구분</h3>
              <div class="form-conts">
                <!-- 라디오 그룹 이름 — 킷 .krds-check-area는 class뿐인 div라 보이는 제목으로 그룹을 묶는다 (kwcag:7.3.2) -->
                <div class="row krds-check-area chk-column" role="radiogroup" aria-labelledby="issue-target-tit">
                  <div class="krds-form-check large">
                    <input type="radio" name="issueTarget" id="issue-target-1" checked>
                    <label for="issue-target-1">구분 예시 1</label>
                  </div>
                  <div class="krds-form-check large">
                    <input type="radio" name="issueTarget" id="issue-target-2">
                    <label for="issue-target-2">구분 예시 2</label>
                  </div>
                </div>
              </div>
            </div>

          </div>
        </div>

        <!-- 발급 유형 선택 -->
        <div class="txt-box bg-white">
          <h2 class="box-tit1">발급 유형 선택</h2>
          <div class="box-cnt">
            <div class="box-sec">
              <h3 class="box-tit2" id="issue-type-tit">발급 유형</h3>
              <div class="form-group">
                <div class="form-conts">
                  <div class="row krds-check-area chk-column" role="radiogroup" aria-labelledby="issue-type-tit">
                    <div class="krds-form-check large">
                      <input type="radio" name="issueType" id="issue-type-1" checked>
                      <label for="issue-type-1">온라인 발급 - 본인 출력</label>
                    </div>
                    <div class="krds-form-check large">
                      <input type="radio" name="issueType" id="issue-type-2">
                      <label for="issue-type-2">온라인 발급 - 전자지갑</label>
                    </div>
                    <div class="krds-form-check large">
                      <input type="radio" name="issueType" id="issue-type-3">
                      <label for="issue-type-3">등기우편</label>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- 신청/취소 — 취소는 이동이므로 링크, 신청은 제출 동작이므로 버튼 -->
    <div class="page-btn-wrap both m-column">
      <a href="{{cancelHref}}" class="krds-btn xlarge tertiary">취소하기</a>
      <button type="button" class="krds-btn xlarge primary">신청하기</button>
    </div>

  </div>
</main>
</div>

<footer>
  <!-- 사이트 공통부 — get_component: footer, identifier 로 채운다 -->
</footer>
</div>

<!-- 모달은 #wrap 밖 -->

<script src="{{assetBase}}/resources/js/component/ui-script.js"></script>
</body>
</html>
