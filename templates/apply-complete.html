<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<!-- 교정: 원본 샘플은 화면 확대를 차단했다 (저시력 사용자 배제) — 확대 허용으로 교체 -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{pageTitle}}</title>
<link rel="stylesheet" href="{{assetBase}}/resources/css/common/common.css">
<link rel="stylesheet" href="{{assetBase}}/resources/css/component/component.css">
<style data-krds-a11y="template">
  /* 킷은 폰트 파일만 동봉하고 @font-face 선언은 소비자 몫이다 */
  @font-face {
    font-family: "Pretendard GOV"; font-weight: 400; font-display: swap;
    src: url("{{assetBase}}/resources/fonts/PretendardGOV-Regular.subset.woff2") format("woff2");
  }
  @font-face {
    font-family: "Pretendard GOV"; font-weight: 500; font-display: swap;
    src: url("{{assetBase}}/resources/fonts/PretendardGOV-Medium.subset.woff2") format("woff2");
  }
  @font-face {
    font-family: "Pretendard GOV"; font-weight: 700; font-display: swap;
    src: url("{{assetBase}}/resources/fonts/PretendardGOV-Bold.subset.woff2") format("woff2");
  }
  /* ==== 원본 패턴 CSS 발췌 시작 — scripts/extract-pattern-css.ts 생성분. 손으로 고치지 말 것 ==== */
/* 출처: https://www.krds.go.kr/resources/css/pattern/output.css
   sha256: 35aa64a0cf17c7790f91535f3c26ee88e8eb4ec7b4d64d509eea2c3610f05e75
   규칙 29건 · 클래스: comp-btn-wrap, comp-info-box, comp-link-box, comp-msg-wrap, inner, key, krds-btn, narrow, point, tit, value */
.comp-msg-wrap {
  --comp-color-text-primary: var(--krds-light-color-text-primary);
  margin-bottom: var(--krds-pc-gap-layout-h2-h3);
  font-size: var(--krds-pc-font-size-heading-large);
  font-weight: var(--krds-font-weight-bold);
  letter-spacing: var(--krds-typo-letter-spacing-1);
  text-align: center;
}
.comp-msg-wrap .point {
  color: var(--comp-color-text-primary);
}
.comp-info-box {
  --comp-color-background: var(--krds-light-color-surface-secondary-subtler);
  display: flex;
  align-items: normal;
  justify-content: flex-start;
  flex-direction: column;
  gap: var(--krds-gap-7);
  padding: var(--krds-padding-10);
  border-radius: var(--krds-radius-xlarge1);
  background: var(--comp-color-background);
}
.comp-info-box > li {
  display: flex;
  align-items: flex-start;
  justify-content: flex-start;
  flex-direction: row;
  gap: var(--krds-gap-4);
  font-size: var(--krds-pc-font-size-body-large);
}
.comp-info-box > li .key {
  flex-shrink: 0;
  font-weight: var(--krds-font-weight-bold);
  width: 19.1rem;
}
.comp-info-box > li .value {
  display: inline-flex;
  align-items: normal;
  justify-content: flex-start;
  flex-direction: column;
  flex: 1;
  gap: var(--krds-gap-5);
}
.comp-btn-wrap {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  flex-direction: row;
  gap: var(--krds-gap-5);
  margin-top: var(--krds-gap-9);
}
.comp-link-box {
  --comp-color-background: var(--krds-light-color-surface-gray-subtler);
  --comp-width-border: var(--krds-light-border-width-static-regular);
  --comp-color-border: var(--krds-light-color-divider-gray-light);
  padding: var(--krds-padding-10);
  margin-top: var(--krds-gap-11);
  border-radius: var(--krds-radius-xlarge1);
  background: var(--comp-color-background);
}
.comp-link-box dt {
  display: flex;
  align-items: normal;
  justify-content: flex-start;
  flex-direction: column;
  gap: var(--krds-pc-gap-layout-title-body-medium);
  padding-bottom: var(--krds-padding-8);
  margin-bottom: var(--krds-padding-8);
  border-bottom: var(--comp-width-border) solid var(--comp-color-border);
}
.comp-link-box dt .tit {
  font-size: var(--krds-pc-font-size-heading-small);
  font-weight: var(--krds-font-weight-bold);
}
.comp-link-box dd {
  display: flex;
  gap: var(--krds-gap-5);
}
@media (max-width: 767px) {
  .comp-msg-wrap {
    margin-bottom: var(--krds-mobile-gap-layout-h2-h3);
    font-size: var(--krds-mobile-font-size-heading-large);
    letter-spacing: var(--krds-typo-letter-spacing-1);
  }
  .comp-info-box {
    padding: var(--krds-padding-8);
    gap: var(--krds-gap-5);
  }
  .comp-info-box > li {
    flex-direction: column;
    gap: var(--krds-gap-3);
    font-size: var(--krds-mobile-font-size-body-large);
  }
  .comp-info-box > li .key {
    width: 100%;
  }
  .comp-info-box > li .value {
    gap: var(--krds-gap-3);
  }
  .comp-btn-wrap {
    flex-wrap: wrap;
    margin-top: var(--krds-gap-7);
  }
  .comp-btn-wrap .krds-btn {
    width: 100%;
  }
  .comp-link-box {
    padding: var(--krds-padding-8);
  }
  .comp-link-box dt {
    gap: var(--krds-mobile-gap-layout-title-body-medium);
  }
  .comp-link-box dt .tit {
    font-size: var(--krds-mobile-font-size-heading-small);
  }
  .comp-link-box dd {
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    flex-direction: column;
    gap: var(--krds-gap-3);
  }
}
[data-krds-mode=high-contrast] .comp-msg-wrap {
  --comp-color-text-primary: var(--krds-high-contrast-color-text-primary);
}
[data-krds-mode=high-contrast] .comp-info-box {
  --comp-color-background: var(--krds-high-contrast-color-surface-secondary-subtler);
}
[data-krds-mode=high-contrast] .comp-link-box {
  --comp-color-background: var(--krds-high-contrast-color-surface-gray-subtler);
  --comp-width-border: var(--krds-high-contrast-border-width-static-regular);
  --comp-color-border: var(--krds-high-contrast-color-divider-gray-light);
}
@media (prefers-color-scheme: dark) {
  [data-krds-mode=theme] .comp-msg-wrap {
    --comp-color-text-primary: var(--krds-high-contrast-color-text-primary);
  }
  [data-krds-mode=theme] .comp-info-box {
    --comp-color-background: var(--krds-high-contrast-color-surface-secondary-subtler);
  }
  [data-krds-mode=theme] .comp-link-box {
    --comp-color-background: var(--krds-high-contrast-color-surface-gray-subtler);
    --comp-width-border: var(--krds-high-contrast-border-width-static-regular);
    --comp-color-border: var(--krds-high-contrast-color-divider-gray-light);
  }
}
@media (min-width: 1024px) {
  .inner.narrow {
    max-width: calc(79.2rem + var(--krds-contents-padding-x) * 2);
  }
}
/* ==== 원본 패턴 CSS 발췌 끝 ==== */
  /* 건너뛰기 도착점은 컨트롤이 아니다 — 프로그램적 초점에 페이지 전체를 감싸는
     초점 링이 뜨지 않게 억제 (킷 전역 *:focus가 main에도 적용되는 것 방지) */
  #main-content:focus { outline: none; box-shadow: none; }
  /* 교정 부속: 본문 컨테이너 교체(#container→main)로 빠진 원본 규칙 승계 —
     본문 최소 높이와 본문-푸터 간격 */
  #main-content > .inner:not(.in-between) {
    min-height: 60rem;
    padding-bottom: var(--krds-pc-gap-layout-contents-footer);
  }

  /* 교정: 킷 v1.1.0 component.css 아이콘 경로 버그(img/img 중복) — 이 페이지에
     보이는 breadcrumb 2곳만 올바른 경로로 재선언 */
  .krds-breadcrumb-wrap .breadcrumb .home .txt::before {
    -webkit-mask-image: url({{assetBase}}/resources/img/component/icon/ico_bread_home.svg);
    mask-image: url({{assetBase}}/resources/img/component/icon/ico_bread_home.svg);
  }
  .krds-breadcrumb-wrap .breadcrumb li:not(:last-child)::after {
    -webkit-mask-image: url({{assetBase}}/resources/img/component/icon/ico_angle.svg);
    mask-image: url({{assetBase}}/resources/img/component/icon/ico_angle.svg);
  }
  /* 교정: 원본 #container 키 규칙 승계 — breadcrumb을 콘텐츠 폭으로 가운데 정렬 (output.css 20848행) */
  #main-content > .krds-breadcrumb-wrap { padding-bottom: 0; }
  #main-content > .krds-breadcrumb-wrap .breadcrumb { max-width: var(--krds-contents-wrap-size); padding: 0 var(--krds-contents-padding-x); }
</style>
</head>
<body data-krds-pattern="apply-complete">
<div id="wrap">

<!-- 교정: 원본 샘플의 건너뛰기 대상(#breadcrumb)은 문서에 존재하지 않았다 -->
<div id="krds-skip-link">
  <a href="#main-content">본문 바로가기</a>
</div>

<header>
  <!-- 사이트 공통부 — get_component: masthead → header → main_menu 로 채운다 -->
</header>

<!-- 교정: 원본 샘플에는 main 랜드마크가 없었다 (div#container) -->
<div id="container">
<main id="main-content" tabindex="-1">

  <!-- 현재 경로 — 킷 breadcrumb 정식 마크업 -->
  <nav class="krds-breadcrumb-wrap" aria-label="현재 경로">
    <ol class="breadcrumb">
      <li class="home"><a href="{{homeHref}}" class="txt">홈</a></li>
      <li><a href="#" class="txt" aria-current="page">{{pageTitle}}</a></li>
    </ol>
  </nav>

  <div class="inner narrow">

    <!-- 완료 메시지 — 교정: 원본은 본문에 h1이 없었다(div뿐) — 완료 메시지가 곧 페이지 제목 -->
    <h1 class="comp-msg-wrap">
      {{serviceName}}<br>
      신청이 <span class="point">완료</span>되었습니다.
    </h1>

    <!-- 신청 정보 — 콘텐츠 자유 영역: 실제 신청 결과 값으로 채운다 -->
    <ul class="comp-info-box">
      <li>
        <div class="key">신청인</div>
        <div class="value">홍길동</div>
      </li>
      <li>
        <div class="key">신청정보</div>
        <div class="value">
          <p class="p">신청 내용 요약 1</p>
          <p class="p">신청 내용 요약 2</p>
        </div>
      </li>
    </ul>

    <!-- 다음 행동 — 패턴 지침: 완료 후 갈 곳을 명확히 제공 -->
    <div class="comp-btn-wrap">
      <a href="{{againHref}}" class="krds-btn xlarge tertiary">다시 신청하기</a>
      <a href="{{resultHref}}" class="krds-btn xlarge primary">신청 내역/결과보기</a>
    </div>

    <!-- 연관 서비스 추천 — 콘텐츠 자유 영역: 없으면 dl 통째로 제거해도 된다 -->
    <dl class="comp-link-box">
      <dt>
        <p class="tit">이런 서비스는 어떠세요?</p>
        <p class="txt">'{{serviceName}}'을(를) 신청하는 분들이 함께 이용한 서비스입니다.</p>
      </dt>
      <dd>
        <a href="#" class="krds-btn medium text">연관 서비스 1 <i class="svg-icon ico-angle right"></i></a>
        <a href="#" class="krds-btn medium text">연관 서비스 2 <i class="svg-icon ico-angle right"></i></a>
        <a href="#" class="krds-btn medium text">모든 서비스 목록 보기 <i class="svg-icon ico-angle right"></i></a>
      </dd>
    </dl>

  </div>
</main>
</div>

<footer>
  <!-- 사이트 공통부 — get_component: footer, identifier 로 채운다 -->
</footer>
</div>

<!-- 모달은 #wrap 밖 -->

<script src="{{assetBase}}/resources/js/component/ui-script.js"></script>
</body>
</html>
