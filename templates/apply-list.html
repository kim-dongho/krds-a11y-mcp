<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<!-- 교정: 원본 샘플의 화면 확대 차단(저시력 배제)을 허용으로 -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{pageTitle}}</title>
<link rel="stylesheet" href="{{assetBase}}/resources/css/common/common.css">
<link rel="stylesheet" href="{{assetBase}}/resources/css/component/component.css">
<style data-krds-a11y="template">
  /* 킷은 폰트 파일만 동봉하고 @font-face 선언은 소비자 몫이다 */
  @font-face {
    font-family: "Pretendard GOV"; font-weight: 400; font-display: swap;
    src: url("{{assetBase}}/resources/fonts/PretendardGOV-Regular.subset.woff2") format("woff2");
  }
  @font-face {
    font-family: "Pretendard GOV"; font-weight: 500; font-display: swap;
    src: url("{{assetBase}}/resources/fonts/PretendardGOV-Medium.subset.woff2") format("woff2");
  }
  @font-face {
    font-family: "Pretendard GOV"; font-weight: 700; font-display: swap;
    src: url("{{assetBase}}/resources/fonts/PretendardGOV-Bold.subset.woff2") format("woff2");
  }
  /* ==== 원본 패턴 CSS 발췌 시작 — scripts/extract-pattern-css.ts 생성분. 손으로 고치지 말 것 ==== */
/* 출처: https://www.krds.go.kr/resources/css/pattern/output.css

@media (max-width: 767px) {
  .search-top-box .sch-form-wrap .sch-input,

/* ==== 원본 패턴 CSS 발췌 끝 ==== */
  /* 건너뛰기 도착점의 초점 링 억제 (컨트롤 아님) */
  #main-content:focus { outline: none; box-shadow: none; }
  /* #container→main 교체로 빠진 규칙 승계 */
  #main-content > .inner:not(.in-between) {
    min-height: 60rem;
    padding-bottom: var(--krds-pc-gap-layout-contents-footer);
  }

  /* 킷 아이콘 경로 버그(img/img) 우회 — 보이는 곳만 재선언 */
  .krds-breadcrumb-wrap .breadcrumb .home .txt::before {
    -webkit-mask-image: url({{assetBase}}/resources/img/component/icon/ico_bread_home.svg);
    mask-image: url({{assetBase}}/resources/img/component/icon/ico_bread_home.svg);
  }
  .krds-breadcrumb-wrap .breadcrumb li:not(:last-child)::after,
  .krds-pagination .page-navi.prev::before,
  .krds-pagination .page-navi.next::after,
  .krds-structured-list .card-body .c-text .c-tit::after {
    -webkit-mask-image: url({{assetBase}}/resources/img/component/icon/ico_angle.svg);
    mask-image: url({{assetBase}}/resources/img/component/icon/ico_angle.svg);
  }
  /* 태그 삭제: 킷은 mask를 끄고 background-image로 그린다 (component.css:8656, 비가시 렌더 실측) */
  .krds-tag-wrap .krds-btn-tag .btn-delete,
  .krds-tag-wrap.large .krds-btn-tag .btn-delete {
    -webkit-mask-image: none;
    mask-image: none;
    background-image: url({{assetBase}}/resources/img/component/icon/ico_delete_fill.svg);
  }
  .krds-form-select {
    background-image: url({{assetBase}}/resources/img/component/icon/ico_angle.svg);
  }
  /* 교정: 킷 셀렉트 기본색 5.4.3 미달(3.08:1) — text-subtle (component.css:9616) */
  .krds-form-select { color: var(--krds-light-color-text-subtle); }
  /* breadcrumb 콘텐츠 폭 정렬 승계 (output.css:20848) */
  #main-content > .krds-breadcrumb-wrap { padding-bottom: 0; }
  #main-content > .krds-breadcrumb-wrap .breadcrumb { max-width: var(--krds-contents-wrap-size); padding: 0 var(--krds-contents-padding-x); }

<body data-krds-pattern="apply-list">
<div id="wrap">

<!-- 교정: 원본의 건너뛰기 대상(#breadcrumb)은 없는 id였다 -->
<div id="krds-skip-link">
  <a href="#main-content">본문 바로가기</a>
</div>

<header>
  <!-- 사이트 공통부 — get_component: masthead → header → main_menu 로 채운다 -->
</header>

<!-- 교정: 원본 샘플에는 main 랜드마크가 없었다 (div#container) -->
<div id="container">
<main id="main-content" tabindex="-1">

  <!-- 현재 경로 — 킷 breadcrumb 정식 마크업 -->
  <nav class="krds-breadcrumb-wrap" aria-label="현재 경로">
    <ol class="breadcrumb">
      <li class="home"><a href="{{homeHref}}" class="txt">홈</a></li>
      <li><a href="#" class="txt" aria-current="page">{{pageTitle}}</a></li>
    </ol>
  </nav>

  <div class="inner">

    <div class="page-title-wrap">
      <h1 class="h-tit">{{pageTitle}}</h1>
    </div>

    <!-- 검색 + 필터 — 필터 항목(레이블·선택지)은 콘텐츠 자유 영역 -->
    <div class="search-top-box">
      <div class="sch-form-wrap">
        <div class="sch-input">
          <!-- 교정: 원본은 title 속성만으로 라벨을 제공했다 — label(sr-only) 연결 -->
          <label for="apply-search" class="sr-only">검색어 입력</label>
          <input type="text" id="apply-search" class="krds-input" placeholder="검색어를 입력해주세요">
          <button type="button" class="krds-btn medium icon ico-search">
            <span class="sr-only">검색</span>
            <i class="svg-icon ico-sch"></i>
          </button>
        </div>
      </div>
      <div class="sch-filter-box">
        <div class="filter-form">
          <div>
            <label class="label" for="filter-sel1">분류 1</label>
            <select id="filter-sel1" class="krds-form-select medium">
              <option value="">전체</option>
              <option value="demo1">항목1</option>
              <option value="demo2">항목2</option>
            </select>
          </div>
          <div>
            <label class="label" for="filter-sel2">분류 2</label>
            <select id="filter-sel2" class="krds-form-select medium">
              <option value="">전체</option>
              <option value="demo1">항목1</option>
              <option value="demo2">항목2</option>
            </select>
          </div>
        </div>
        <dl class="filter-chip">
          <dt>선택된 필터 <span class="num">2</span></dt>
          <dd>
            <button type="button" class="krds-btn xlarge icon border">
              <span class="sr-only">필터 초기화</span>
              <i class="svg-icon ico-refresh"></i>
            </button>
            <div class="chip-wrap krds-tag-wrap large">
              <span class="krds-btn-tag">
                필터값1
                <button type="button" class="btn-delete">
                  <span class="sr-only">필터값1 삭제</span>
                </button>
              </span>
              <span class="krds-btn-tag">
                필터값2
                <button type="button" class="btn-delete">
                  <span class="sr-only">필터값2 삭제</span>
                </button>
              </span>
            </div>
          </dd>
        </dl>
      </div>
    </div>

    <!-- 결과 상단 — 결과 수는 aria-live로 변경 통지 (원본 유지) -->
    <div class="search-list-top">
      <ul class="sch-info" aria-live="polite">
        <li>검색 결과 <span class="point">0</span>건</li>
      </ul>
      <ul class="sch-sort">
        <li class="m-hide">
          <strong class="sort-label"><label for="result-count">목록 표시 개수</label></strong>
          <select class="krds-form-select-sort" id="result-count">
            <option>10개</option>
            <option>30개</option>
          </select>
        </li>
        <li>
          <strong class="sort-label"><label for="sort-select">정렬기준</label></strong>
          <div class="w-sort-btn">
            <!-- 교정: 정렬 선택 상태가 시각(active)뿐이었다 — aria-pressed로 노출 -->
            <button type="button" class="active" aria-pressed="true">관련도순</button>
            <button type="button" aria-pressed="false">최신순</button>
            <button type="button" aria-pressed="false">인기순</button>
          </div>
          <div class="m-sort-btn">
            <select class="krds-form-select-sort" id="sort-select">
              <option>관련도순</option>
              <option>최신순</option>
              <option>인기순</option>
            </select>
          </div>
        </li>
