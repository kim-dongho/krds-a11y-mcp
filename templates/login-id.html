.conts-area.login-form {
  --login-type-color-tooltip: var(--krds-light-color-icon-gray);
}
.login-form-area {
  --login-form-color-border: var(--krds-light-color-divider-gray);
  --login-form-width-border: var(--krds-light-border-width-variable-regular);
  display: flex;
  position: relative;
  padding: var(--krds-padding-10);
  gap: var(--krds-gap-12);
  width: 100%;
  border-top: var(--login-form-width-border) solid var(--login-form-color-border);
  border-bottom: var(--login-form-width-border) solid var(--login-form-color-border);
}
.login-form-area::after {
  content: "";
  position: absolute;
  top: var(--krds-gap-9);
  left: calc(50% - var(--login-form-width-border));
  width: var(--login-form-width-border);
  height: calc(100% - var(--krds-gap-12));
  background-color: var(--login-form-color-border);
}
.login-form-area > div {
  flex: 1;
}
.link-group {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: row;
}
.link-group > li + li::before {
  display: inline-block;
  vertical-align: middle;
  margin: 0 var(--krds-gap-3);
  content: "";
  width: var(--krds-number-1);
  height: var(--krds-size-height-2);
  background-color: var(--login-form-color-border);
}
.login-form-area .login-info-wrap {
  padding: var(--krds-padding-8) 0;
}
@media (max-width: 1023px) {
  .login-form-area {
    flex-direction: column;
    padding: var(--krds-padding-8) 0;
    gap: var(--krds-gap-8);
  }
  .login-form-area::after {
    display: none;
  }
  .login-form-area .login-info-wrap {
    padding-bottom: 0;
    border-top: var(--krds-light-border-width-variable-regular) solid var(--krds-light-color-divider-gray);
  }
}
@media (max-width: 767px) {
  .conts-area[class*=login-] {
    gap: var(--krds-gap-7);
  }
}
[data-krds-mode=high-contrast] .login-form-area {
  --login-form-color-border: var(--krds-high-contrast-color-divider-gray);
  --login-form-width-border: var(--krds-high-contrast-border-width-variable-regular);
}
@media (prefers-color-scheme: dark) {

    --login-form-width-border: var(--krds-high-contrast-border-width-variable-regular);
  }
}
/* ==== 원본 패턴 CSS 발췌 끝 ==== */
  /* 건너뛰기 도착점은 컨트롤이 아니다 — 프로그램적 초점에 페이지 전체를 감싸는
     초점 링이 뜨지 않게 억제 (킷 전역 *:focus가 main에도 적용되는 것 방지) */
  #main-content:focus { outline: none; box-shadow: none; }
  /* 교정 부속: 본문 컨테이너 교체(#container→main)로 빠진 원본 규칙 승계 —
     본문 최소 높이와 본문-푸터 간격 */
  #main-content > .inner:not(.in-between) {
    min-height: 60rem;
    padding-bottom: var(--krds-pc-gap-layout-contents-footer);
  }

  /* 교정: 프라이머리 파랑(#256ef4)은 회색 배경 위에서 대비 4.16:1로 미달(4.5:1 필요)
     — 킷 토큰 내 진한 단계로 교체 */
  .helper-box a.krds-btn.link { color: var(--krds-color-light-primary-70); }
  .helper-box a.krds-btn.link .underline { color: inherit; }

  /* 교정: 킷 v1.1.0 component.css 아이콘 경로 버그 — url(../../img/img/…)로 img가
     중복돼 206곳이 404로 깨진다 — 오류 표시 없이 아이콘만 사라진다 (사이트 배포판 CSS에는 없는 npm 패키징 결함).
     이 페이지에 보이는 3곳만 올바른 경로로 재선언 */
  .krds-breadcrumb-wrap .breadcrumb .home .txt::before {
    -webkit-mask-image: url({{assetBase}}/resources/img/component/icon/ico_bread_home.svg);
    mask-image: url({{assetBase}}/resources/img/component/icon/ico_bread_home.svg);
  }
  .krds-breadcrumb-wrap .breadcrumb li:not(:last-child)::after {
    -webkit-mask-image: url({{assetBase}}/resources/img/component/icon/ico_angle.svg);
    mask-image: url({{assetBase}}/resources/img/component/icon/ico_angle.svg);
  }
  .krds-form-check input[type=checkbox] ~ label:after {
    -webkit-mask-image: url({{assetBase}}/resources/img/component/icon/ico_checkbox_checked.svg);
    mask-image: url({{assetBase}}/resources/img/component/icon/ico_checkbox_checked.svg);
  }
  /* 교정: 원본 #container 키 규칙 승계 — breadcrumb을 콘텐츠 폭으로 가운데 정렬 (output.css 20848행) */
  #main-content > .krds-breadcrumb-wrap { padding-bottom: 0; }
  #main-content > .krds-breadcrumb-wrap .breadcrumb { max-width: var(--krds-contents-wrap-size); padding: 0 var(--krds-contents-padding-x); }
</style>

<body data-krds-pattern="login-id">
<div id="wrap">

<!-- 교정: 원본 샘플의 건너뛰기 대상(#breadcrumb)은 문서에 존재하지 않았다 -->
<div id="krds-skip-link">
  <a href="#main-content">본문 바로가기</a>
</div>

<header>
  <!-- 사이트 공통부 — get_component: masthead → header → main_menu 로 채운다 -->
</header>

<!-- 교정: 원본 샘플에는 main 랜드마크가 없었다 (div#container) -->
<div id="container">
<main id="main-content" tabindex="-1">
  <div class="inner">

    <!-- 현재 경로 — 킷 breadcrumb 정식 마크업 -->
    <nav class="krds-breadcrumb-wrap" aria-label="현재 경로">
      <ol class="breadcrumb">
        <li class="home"><a href="{{homeHref}}" class="txt">홈</a></li>
        <li><a href="#" class="txt" aria-current="page">{{pageTitle}}</a></li>
      </ol>
    </nav>

    <!-- 페이지 타이틀 — KRDS 로그인 패턴(service_03_05) 구조 -->
    <div class="page-title-wrap">
      <h1 class="h-tit"><span class="small-txt">{{serviceName}}</span>{{pageTitle}}</h1>
    </div>

    <div class="conts-area login-form">
      <div class="login-form-area">
        <div class="login-wrap">
          <form method="post" action="{{loginAction}}">
            <fieldset>
              <legend>아이디와 비밀번호로 로그인</legend>
              <div class="fieldset">

                <!-- 패턴 지침 순서: 레이블 → 입력 → 상태 유지 → 찾기 링크 → 도움말 -->
                <div class="form-group">
                  <div class="form-tit">
                    <label for="login-id">아이디</label>
                  </div>
                  <div class="form-conts">
                    <input type="text" id="login-id" name="loginId" class="krds-input"
                      placeholder="아이디를 입력하세요" autocomplete="username">
                  </div>
                </div>

                <div class="form-group">
                  <div class="form-tit">
                    <label for="login-pw">비밀번호</label>
                  </div>
                  <div class="form-conts btn-ico-wrap">
                    <input type="password" id="login-pw" name="loginPw" class="krds-input"
                      placeholder="비밀번호를 입력하세요" autocomplete="current-password">
                    <button type="button" class="krds-btn medium icon">
                      <span class="sr-only">입력한 비밀번호 보기</span>
                      <i class="svg-icon ico-pw-visible"></i>
                    </button>
                  </div>
                </div>

                <div class="form-group krds-check-area">
                  <div class="krds-form-check">
                    <input type="checkbox" name="keepLogin" id="keep-login">
                    <label for="keep-login">로그인 상태 유지</label>
                  </div>
                </div>

                <div class="form-group">
                  <button type="submit" class="krds-btn large primary">로그인</button>
                </div>

                <div class="form-group">
                  <ul class="link-group">
