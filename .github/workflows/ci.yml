name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
      # 테스트가 템플릿 미리보기(생성물, gitignore)를 연다
      - run: pnpm build:previews
      - run: pnpm test
      - run: pnpm build

  a11y-gate:
    # pre-push 훅과 같은 접근성 게이트 — 로컬 훅을 우회한 변경도 여기서 막는다
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build:previews
      - run: pnpm scan:axe
      - run: pnpm verify:a11y
