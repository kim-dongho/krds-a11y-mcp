name: Daily security report

on:
  schedule:
    # UTC 00:00 = 한국 시간 오전 09:00
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-security-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Fix moderate and higher vulnerabilities and generate report
        run: node scripts/security-report.mjs --fix
      - name: Install dependencies for validation
        run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Validate security fixes
        run: |
          node --test scripts/security-report.test.mjs
          pnpm typecheck
          pnpm build:previews
          pnpm test
          pnpm build
          pnpm scan:axe
          pnpm verify:a11y
      - name: Create or update report PR
        # 변경은 이 브랜치에만 커밋한다. 기본 브랜치 반영은 사용자의 PR 머지로 진행한다.
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/security-report
          add-paths: |
            docs/security/dependency-report.md
            package.json
            pnpm-workspace.yaml
            pnpm-lock.yaml
          commit-message: 'fix: 의존성 보안 취약점 수정 및 보고서 갱신'
          title: 'fix: 일일 의존성 보안 점검 및 취약점 수정'
          body-path: docs/security/dependency-report.md
